name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          CRM_PORT=8001 CRM_ENV_FILE=.env CRM_DATA_DIR=./data \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            -f docker-compose.port.yml -f docker-compose.instance.yml config --quiet

      - name: Assert image drops root after chowning data
        run: |
          # The entrypoint must start as root to chown ./data, then gosu.
          if grep -qE '^USER ' Dockerfile; then
            echo "ERROR: Dockerfile USER would run the entrypoint as non-root"
            exit 1
          fi
          grep -qF 'ENTRYPOINT ["/app/docker-entrypoint.sh"]' Dockerfile
          sh -n docker-entrypoint.sh
          sh -n docker-entrypoint-lib.sh
          grep -qF 'exec gosu' docker-entrypoint.sh
          grep -qF 'umask 077' docker-entrypoint.sh
          grep -qF 'chmod 600' docker-entrypoint-lib.sh
          grep -qF 'cap_drop' docker-compose.prod.yml
          grep -qF 'no-new-privileges:true' docker-compose.prod.yml
          grep -qF 'read_only: true' docker-compose.prod.yml
          if grep -E '^[[:space:]]+-[[:space:]]*DAC_OVERRIDE' docker-compose.prod.yml; then
            echo "ERROR: do not re-add CAP_DAC_OVERRIDE (issue 70)" >&2
            exit 1
          fi
          grep -qF 'PYTHONDONTWRITEBYTECODE=1' Dockerfile
          grep -qF 'pip install --no-cache-dir --upgrade pip' Dockerfile

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Binary rather than gitleaks-action, which needs a licence on org repos.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for committed secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1 --no-banner

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key
          DATABASE_URL: sqlite:////tmp/ci_crm.db
        run: python -m pytest tests/ -q

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Audit pinned Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image and fail if .env or data/*.db were copied
        run: |
          chmod +x .github/scripts/check-image-hygiene.sh
          .github/scripts/check-image-hygiene.sh agent-crm:ci

      - name: Entrypoint survives cap_drop restart (issue 70)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          mkdir -p "$tmp/data"
          echo x > "$tmp/data/crm.db"
          # Post-first-boot volume: APP_UID 1000, mode 0700.
          docker run --rm -v "$tmp/data:/app/data" alpine \
            sh -c 'chown -R 1000:1000 /app/data && chmod 700 /app/data'
          # Control: the issue-70 alpine repro still fails (we did not re-add DAC_OVERRIDE).
          if docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add FOWNER \
              --cap-add SETUID --cap-add SETGID \
              --security-opt no-new-privileges:true \
              -v "$tmp/data:/app/data" alpine \
              sh -c 'chown -R 1000:1000 /app/data'; then
            echo "ERROR: expected chown -R to fail without CAP_DAC_OVERRIDE" >&2
            exit 1
          fi
          # Real image + prod caps: skip repair, gosu, succeed.
          out=$(docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:mode=1777 \
            -v "$tmp/data:/app/data" \
            agent-crm:ci \
            id)
          echo "$out"
          echo "$out" | grep -q 'uid=1000'
          # Second start on the same volume (the restart that used to crash-loop).
          docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:mode=1777 \
            -v "$tmp/data:/app/data" \
            agent-crm:ci \
            true

      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-crm:ci
          severity: HIGH,CRITICAL
          format: table
          # Report findings without gating the PR on the current 2024 pins /
          # slim base. Dependabot + this job make the vulns visible.
          exit-code: "0"
          ignore-unfixed: true
