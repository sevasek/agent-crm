name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Assert image drops root after chowning data
        run: |
          # The entrypoint must start as root to chown ./data, then gosu.
          if grep -qE '^USER ' Dockerfile; then
            echo "ERROR: Dockerfile USER would run the entrypoint as non-root"
            exit 1
          fi
          grep -qF 'ENTRYPOINT ["/app/docker-entrypoint.sh"]' Dockerfile
          sh -n docker-entrypoint.sh
          grep -qF 'exec gosu' docker-entrypoint.sh
          grep -qF 'umask 077' docker-entrypoint.sh
          grep -qF 'chmod 600' docker-entrypoint.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # Binary rather than gitleaks-action, which needs a licence on org repos.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for committed secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1 --no-banner

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key
          DATABASE_URL: sqlite:////tmp/ci_crm.db
        run: python -m pytest tests/ -q

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Audit pinned Python dependencies (report-only)
        run: |
          pip install pip-audit
          # fastapi==0.115.0 pins starlette 0.38.x, which currently fails
          # pip-audit. Keep this visible but non-gating until a dedicated
          # FastAPI/Starlette bump can pass. Same policy as the Trivy job.
          pip-audit -r requirements.txt || true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and fail if .env or data/*.db were copied
        run: |
          chmod +x .github/scripts/check-image-hygiene.sh
          .github/scripts/check-image-hygiene.sh agent-crm:ci

      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-crm:ci
          severity: HIGH,CRITICAL
          format: table
          # Report findings without gating the PR on the current 2024 pins /
          # slim base. Dependabot + this job make the vulns visible.
          exit-code: "0"
          ignore-unfixed: true
