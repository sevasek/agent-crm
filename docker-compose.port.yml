# Optional port overlay for a second instance on the same host.
# A sibling change is parametrizing docker-compose.prod.yml the same way
# (`127.0.0.1:${CRM_PORT:-8000}:8000`); this file keeps new-instance.sh
# working either way. Requires Docker Compose 2.24+ (!override).
#
#   CRM_PORT=8001 docker compose -f docker-compose.yml \
#     -f docker-compose.prod.yml -f docker-compose.port.yml up -d

services:
  app:
    ports: !override
      - "127.0.0.1:${CRM_PORT:-8000}:8000"
