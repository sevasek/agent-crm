# Production overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Needs Docker Compose 2.24+ (uses !reset / !override).
#
# The app listens on 127.0.0.1:${CRM_PORT:-8000} only. Put a TLS-terminating
# reverse proxy (Caddy, nginx, Traefik) in front of it and forward everything,
# including /mcp and /oauth/*, which are gated by their own keys rather than a
# session. See docs/DEPLOY.md.

services:
  app:
    # The dev file sets environment defaults, and Compose's `environment:`
    # wins over `env_file:`. Reset it so your real .env is what the app sees.
    environment: !reset []
    # Dev bind-mounts ./app for live editing. In production the image is the
    # source of truth; keep only the data volume.
    volumes: !override
      - ./data:/app/data
    ports: !override
      - "127.0.0.1:${CRM_PORT:-8000}:8000"
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # Do not set `user:`. The image starts as root so docker-entrypoint.sh can
    # chown a still-root-owned ./data, then drops to APP_UID/APP_GID. Setting
    # `user:` skips that first-boot repair and can leave sqlite read-only.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    # Entrypoint starts as root, repairs ./data only when it can traverse and
    # ownership is wrong, then gosu. A 0700 APP_UID volume on restart is left
    # alone (issue 70). Keep CHOWN/FOWNER for first-boot repair and
    # SETUID/SETGID for gosu; drop everything else, including DAC_OVERRIDE.
    # no-new-privileges stops a later exec from regaining caps.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777

  # Daily follow-up check: logs each due follow-up on the contact's timeline.
  staleness-cron:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: python -u scripts/staleness_cron.py
    # Inherits the image's HEALTHCHECK, but this container serves no HTTP.
    healthcheck:
      disable: true
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # Same image/entrypoint as app: skip repair on an already-APP_UID volume.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
